# AR02 + AR33 · Arkestra builds, installers and releases for macOS (arm64), Windows (x64)
# and Linux (x64).
#   - every night from main: build, and a release when main changed since the last one;
#   - by hand from any branch (release only when asked);
#   - on pull requests that touch the build: build and installers, no release.
# Each job prepares the VS Code source with scripts/prepare.sh, builds it with VSCodium's
# build.sh and makes the installers with its prepare_assets.sh. The release job publishes
# them and writes the update feed (scripts/update-feed.sh) to the versions branch, which
# the app reads. The Rust CLI and the remote server are off.
name: Build

on:
  schedule:
    - cron: '30 1 * * *' # 02:30 CET
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a release and update the feed'
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'branding/**'
      - 'scripts/prepare.sh'
      - 'scripts/update-feed.sh'
      - 'vendor/vscodium/**'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One version for every platform (VSCodium's scheme: VS Code tag + hour of the year), and
  # whether this run builds and releases.
  version:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.v.outputs.release_version }}
      build: ${{ steps.v.outputs.build }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ASKED: ${{ inputs.release }}
        run: |
          TAG="$( jq -r '.tag' vendor/vscodium/upstream/stable.json )"
          RELEASE_VERSION="${TAG}$( printf "%04d" $(( $(date +%-j) * 24 + $(date +%-H) )) )"
          BUILD=true
          RELEASE=false
          if [[ "${EVENT}" == "schedule" ]]; then
            LAST="$( gh release list --repo "${GITHUB_REPOSITORY}" --limit 1 --json tagName -q '.[0].tagName' )"
            LAST_SHA="$( [[ -n "${LAST}" ]] && gh release view "${LAST}" --repo "${GITHUB_REPOSITORY}" --json targetCommitish -q .targetCommitish || true )"
            if [[ "${LAST_SHA}" == "${GITHUB_SHA}" ]]; then
              echo "main is unchanged since ${LAST}: no build tonight"
              BUILD=false
            else
              RELEASE=true
            fi
          elif [[ "${EVENT}" == "workflow_dispatch" && "${ASKED}" == "true" ]]; then
            RELEASE=true
          fi
          echo "release_version=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "build=${BUILD}" >> "${GITHUB_OUTPUT}"
          echo "release=${RELEASE}" >> "${GITHUB_OUTPUT}"
          echo "RELEASE_VERSION=${RELEASE_VERSION} build=${BUILD} release=${RELEASE}"

  build:
    needs: version
    if: needs.version.outputs.build == 'true'
    name: ${{ matrix.os_name }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, os_name: linux, arch: x64, platform: linux }
          - { runner: macos-15, os_name: osx, arch: arm64, platform: darwin }
          - { runner: windows-2022, os_name: windows, arch: x64, platform: win32 }
    defaults:
      run:
        shell: bash
    env:
      OS_NAME: ${{ matrix.os_name }}
      VSCODE_ARCH: ${{ matrix.arch }}
      RELEASE_VERSION: ${{ needs.version.outputs.release_version }}
      # Packed on the runner itself (VSCodium's own CI packs in a second job).
      CI_BUILD: 'no'
      SHOULD_BUILD: 'yes'
      SHOULD_BUILD_CLI: 'no'
      SHOULD_BUILD_REH: 'no'
      SHOULD_BUILD_REH_WEB: 'no'
      # Installers (prepare_assets.sh): Windows user and system setup and zip; Linux deb,
      # rpm and tar.gz; macOS zip, plus the DMG once the app is signed. No MSI, AppImage, snap.
      SHOULD_BUILD_ZIP: 'yes'
      SHOULD_BUILD_EXE_SYS: 'yes'
      SHOULD_BUILD_EXE_USR: 'yes'
      SHOULD_BUILD_MSI: 'no'
      SHOULD_BUILD_MSI_NOUP: 'no'
      SHOULD_BUILD_DEB: 'yes'
      SHOULD_BUILD_RPM: 'yes'
      SHOULD_BUILD_TAR: 'yes'
      SHOULD_BUILD_APPIMAGE: 'no'
      SHOULD_BUILD_DMG: 'yes'
      SHOULD_BUILD_SRC: 'no'
      # macOS signing and notarization (vendor/vscodium/build/osx/prepare_assets.sh): on as
      # soon as these secrets exist; until then the Mac build is unsigned.
      CERTIFICATE_OSX_P12_DATA: ${{ secrets.CERTIFICATE_OSX_P12_DATA }}
      CERTIFICATE_OSX_P12_PASSWORD: ${{ secrets.CERTIFICATE_OSX_P12_PASSWORD }}
      CERTIFICATE_OSX_APPLE_ID: ${{ secrets.CERTIFICATE_OSX_APPLE_ID }}
      CERTIFICATE_OSX_TEAM_ID: ${{ secrets.CERTIFICATE_OSX_TEAM_ID }}
      CERTIFICATE_OSX_APP_PASSWORD: ${{ secrets.CERTIFICATE_OSX_APP_PASSWORD }}
      WORK: ${{ github.workspace }}/build/work
      # Downloads from GitHub during the build (ripgrep, Electron) go over the API limit without it.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Keep LF line endings (Windows; the scripts and patches need them)
        if: matrix.os_name == 'windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Free disk space (Linux)
        if: matrix.os_name == 'linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: Build dependencies (Linux)
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libkrb5-dev libx11-dev libxkbfile-dev libsecret-1-dev fakeroot rpm

      - name: GNU sed first (macOS; Arkestra's names step uses it)
        if: matrix.os_name == 'osx'
        run: |
          brew install gnu-sed
          echo "$(brew --prefix)/opt/gnu-sed/libexec/gnubin" >> "${GITHUB_PATH}"

      - uses: actions/setup-node@v4
        with:
          node-version-file: vendor/vscodium/.nvmrc

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare the source (VS Code at the pinned commit, Arkestra identity)
        run: ARKESTRA_SKIP_PREPARE=yes bash scripts/prepare.sh "${WORK}"

      - name: Build and pack
        working-directory: build/work
        run: |
          . ../../branding/arkestra.env
          bash ./build.sh

      # Apple Silicon runs no binary without a signature, and the build changed Electron's own.
      # Until the Apple certificate is set, the app gets an ad-hoc signature: it starts after
      # the first "Open Anyway", but cannot update itself or pass Gatekeeper on its own.
      - name: Ad-hoc signature (macOS, without the Apple certificate)
        if: matrix.os_name == 'osx' && env.CERTIFICATE_OSX_P12_DATA == ''
        working-directory: build/work
        run: |
          codesign --force --deep --sign - "VSCode-darwin-${VSCODE_ARCH}"/*.app
          codesign --verify --deep --strict --verbose=2 "VSCode-darwin-${VSCODE_ARCH}"/*.app

      - name: Installers and checksums
        working-directory: build/work
        run: |
          . ../../branding/arkestra.env
          # CI_BUILD=yes here only keeps the Linux step from building a snap.
          CI_BUILD=yes bash ./prepare_assets.sh
          if [[ "${OS_NAME}" == "windows" ]]; then bash ./prepare_checksums.sh; fi
          ls -la assets

      - uses: actions/upload-artifact@v4
        with:
          name: arkestra-${{ matrix.platform }}-${{ matrix.arch }}-${{ env.RELEASE_VERSION }}
          path: build/work/assets/*
          retention-days: 14
          if-no-files-found: error

  release:
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.version.outputs.release_version }}
      ASSETS_REPOSITORY: ${{ github.repository }}
      # An unsigned Mac app cannot update itself (Squirrel checks the signature): the macOS
      # feed entry is written only for signed builds.
      FEED_DARWIN: ${{ secrets.CERTIFICATE_OSX_P12_DATA != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Release
        run: |
          ls -la assets
          gh release create "${RELEASE_VERSION}" --repo "${ASSETS_REPOSITORY}" --target "${GITHUB_SHA}" \
            --title "Arkestra ${RELEASE_VERSION}" --prerelease --generate-notes assets/*

      - name: Update feed (versions branch)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin versions > /dev/null; then
            git fetch --depth 1 origin versions
            git worktree add feed FETCH_HEAD
            git -C feed checkout -B versions
          else
            git worktree add --detach feed
            git -C feed checkout --orphan versions
            git -C feed rm -rqf .
            printf '# Arkestra update feed\n\nWritten by the Build workflow (scripts/update-feed.sh); read by the app.\n' > feed/README.md
          fi
          bash scripts/update-feed.sh assets feed
          git -C feed add -A
          git -C feed commit -qm "Update feed: ${RELEASE_VERSION}"
          git -C feed push origin versions

# AR02 · Arkestra builds for macOS (arm64, x64), Windows (x64) and Linux (x64): every
# night from main, by hand from any branch, and on pull requests that touch the build.
# Each job prepares the VS Code source with scripts/prepare.sh, builds and packs it with
# VSCodium's build.sh, and keeps the packed app as a workflow artifact. Installers,
# releases and auto-update come with AR33; the Rust CLI and the remote server are off.
name: Build

on:
  schedule:
    - cron: '30 1 * * *' # 02:30 CET
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'branding/**'
      - 'scripts/prepare.sh'
      - 'vendor/vscodium/**'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os_name }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, os_name: linux, arch: x64, platform: linux }
          - { runner: macos-15, os_name: osx, arch: arm64, platform: darwin }
          - { runner: macos-15-intel, os_name: osx, arch: x64, platform: darwin }
          - { runner: windows-2022, os_name: windows, arch: x64, platform: win32 }
    defaults:
      run:
        shell: bash
    env:
      OS_NAME: ${{ matrix.os_name }}
      VSCODE_ARCH: ${{ matrix.arch }}
      # Packed on the runner itself (VSCodium's own CI packs in a second job).
      CI_BUILD: 'no'
      SHOULD_BUILD: 'yes'
      SHOULD_BUILD_CLI: 'no'
      SHOULD_BUILD_REH: 'no'
      SHOULD_BUILD_REH_WEB: 'no'
      WORK: ${{ github.workspace }}/build/work
    steps:
      - name: Keep LF line endings (Windows; the scripts and patches need them)
        if: matrix.os_name == 'windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Free disk space (Linux)
        if: matrix.os_name == 'linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: Build dependencies (Linux)
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libkrb5-dev libx11-dev libxkbfile-dev libsecret-1-dev fakeroot

      - name: GNU sed first (macOS; Arkestra's names step uses it)
        if: matrix.os_name == 'osx'
        run: |
          brew install gnu-sed
          echo "$(brew --prefix)/opt/gnu-sed/libexec/gnubin" >> "${GITHUB_PATH}"

      - uses: actions/setup-node@v4
        with:
          node-version-file: vendor/vscodium/.nvmrc

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare the source (VS Code at the pinned commit, Arkestra identity)
        run: ARKESTRA_SKIP_PREPARE=yes bash scripts/prepare.sh "${WORK}"

      - name: Build and pack
        working-directory: build/work
        run: |
          . ../../branding/arkestra.env
          bash ./build.sh

      - name: Pack the app
        id: pack
        working-directory: build/work
        run: |
          mkdir -p ../out
          NAME="arkestra-${{ matrix.platform }}-${VSCODE_ARCH}-${RELEASE_VERSION}"
          DIR="VSCode-${{ matrix.platform }}-${VSCODE_ARCH}"
          case "${OS_NAME}" in
            osx) ditto -c -k --sequesterRsrc --keepParent "${DIR}"/*.app "../out/${NAME}.zip" ;;
            windows) (cd "${DIR}" && 7z a -tzip -bd "../../out/${NAME}.zip" . > /dev/null) ;;
            *) tar czf "../out/${NAME}.tar.gz" -C "${DIR}" . ;;
          esac
          ls -la ../out
          echo "name=${NAME}" >> "${GITHUB_OUTPUT}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: build/out/*
          retention-days: 14
          if-no-files-found: error
